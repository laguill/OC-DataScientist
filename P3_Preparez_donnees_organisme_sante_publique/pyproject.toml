[project]
authors = [{ name = "laguill", email = "guillaumelafon13@gmail.com" }]
dependencies = []
description = "Open food fact db analysis"
name = "P3_Preparez_donnees_organisme_sante_publique"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
p3_preparez_donnees_organisme_sante_publique = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = ">=3.13.1,<3.14"
jupyterlab = ">=4.3.6,<5"
ipykernel = ">=6.29.5,<7"
pixi-kernel = ">=0.6.2,<0.7"
pandas = ">=2.2.3,<3"
quarto = ">=1.6.42,<2"
jupyter-cache = ">=1.0.1,<2"
missingno = ">=0.5.2,<0.6"
ipywidgets = ">=8.1.5,<9"
itables = ">=2.2.5,<3"
altair-all = ">=5.5.0,<6"
jupyter_client = ">=8.6.3,<9"
scipy = ">=1.15.2,<2"
scikit-learn = ">=1.6.1,<2"
vega_datasets = ">=0.9.0,<0.10"
pyautogui = ">=0.9.54,<0.10"
altair_data_server = ">=0.4.1,<0.5"
vegafusion = ">=2.0.1,<3"
vegafusion-python-embed = ">=1.6.9,<2"
vl-convert-python = ">=1.7.0,<2"
seaborn = ">=0.13.2,<0.14"
jupyter_console = ">=6.6.3,<7"
plotly = ">=6.0.1,<7"

[dependency-groups]
dev = ["ruff", "mypy==1.13", "basedpyright"]
test = ["pytest"]

[tool.pixi.environments]
# Extend the default environment with multiple features
default = { features = ["dev", "test"], solve-group = "default" }
# Have only the default dependencies and the added test dependencies.
test = { features = ["test"], solve-group = "default" }

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb", "*.qmd"]

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",    # Mypy is better at this
  "COM",    # Formatter takes care of our commas
  "E501",   # leave line-length enforcement to formatter
  "T201",   # I am using print
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",   # D100-104 missing docstring
  "D107",   # undocumented-public-init
  "E402",   # unused import
  "F401",
  "INP001", # missing __init__ in external library
]
# Add the `line-too-long` rule to the enforced rule set.
extend-select = ["W505"]

[tool.ruff.lint.isort]
lines-between-types = 1
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.mypy]
# Prototypage
check_untyped_defs = false    # Ne vérifie pas les fonctions non typées
follow_imports = "skip"       # Ignore les modules importés
ignore_missing_imports = true # Ignore les erreurs d'importations
pretty = true                 # Enhance the readability of error messages
show_column_numbers = true
warn_unused_configs = true    # Alerte sur des options non reconnues

[tool.pyright]
reportAny = "none"                 # Disable checks for implicit Any
reportExplicitAny = "none"         # Disable checks for explicit Any
reportUnknownVariableType = "none"
reportUnusedImport = "none"
reportUnknownMemberType = "none"
reportUnusedCallResult = "none"
