[project]
authors = [{ name = "laguill", email = "guillaumelafon13@gmail.com" }]
name = "P6_Classifier_automatiquement_biens_consommation"
version = "0.1.0"
description = "Etudier la faisabilité d'un moteur de classification d'articles"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "datasets>=3.6.0",
  "en-core-web-sm>=3.8.0",
  "gensim>=4.3.3",
  "marimo[recommended]>=0.13.8",
  "nltk>=3.9.1",
  "opencv-python>=4.11.0.86",
  "pandas>=2.2.3",
  "pip>=25.1.1",
  "plot-keras-history>=1.1.39",
  "plotly>=6.0.1",
  "python-lsp-ruff>=2.2.2",
  "python-lsp-server>=1.12.2",
  "requests>=2.32.4",
  "scikit-learn>=1.6.1",
  "seaborn>=0.13.2",
  "sentence-transformers>=4.1.0",
  "spacy>=3.8.7",
  "sqlalchemy>=2.0.41",
  "sqlfluff>=3.4.0",
  "tensorflow>=2.19.0",
  "tensorflow-hub>=0.16.1",
  "tf-keras>=2.19.0", # nécessaire lors de l'utilisation de keras
  "torch>=2.7.1",
  "torchvision>=0.22.1",
  "transformers<5.0", # above 5.0 tensorflow is no more supported by hugging face
  "uv-bump>=0.1.2",
  "watchdog>=6.0.0",
  "websockets>=15.0.1",
  "wordcloud>=1.9.4",
  "ydata-profiling[notebook]>=4.16.1",
  "yellowbrick>=1.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[dependency-groups]
dev = [
  "ipykernel>=6.29.5",
  "mypy>=1.15.0",
  "uv-bump>=0.1.2",
]

[tool.marimo.runtime]
pythonpath = ["."]
dotenv = [".env"]

[tool.marimo.experimental]
lsp = true
table_charts = true

[tool.marimo.formatting]
line_length = 120

[tool.marimo.diagnostics]
enabled = true

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb", "*.qmd"]

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",     # Mypy is better at this
  "COM",     # Formatter takes care of our commas
  "E501",    # leave line-length enforcement to formatter
  "T201",    # I am using print
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",    # D100-104 missing docstring
  "D107",    # undocumented-public-init
  "E402",    # unused import
  "F401",
  "INP001",  # missing __init__ in external library
  "N803",    # variable name should be lower case do not apply in ML
  "N806",    # same as above but for functions
  "PLR1711", # Needed in marimo
]
# Add the `line-too-long` rule to the enforced rule set.
extend-select = ["W505"]

[tool.ruff.lint.isort]
lines-between-types = 1
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.mypy]
# Prototypage
check_untyped_defs = false    # Ne vérifie pas les fonctions non typées
follow_imports = "skip"       # Ignore les modules importés
ignore_missing_imports = true # Ignore les erreurs d'importations
pretty = true                 # Enhance the readability of error messages
show_column_numbers = true
warn_unused_configs = true    # Alerte sur des options non reconnues

[tool.pyright]
reportAny = "none"                  # Disable checks for implicit Any
reportExplicitAny = "none"          # Disable checks for explicit Any
reportUnknownVariableType = "none"
reportUnusedImport = "none"
reportUnknownMemberType = "none"
reportUnusedCallResult = "none"
reportMissingTypeStubs = "none"
reportMissingParameterType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
