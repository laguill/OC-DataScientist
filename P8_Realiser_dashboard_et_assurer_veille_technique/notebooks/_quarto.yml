project:
  type: manuscript
  output-dir: ../soutenance

manuscript:
  article: index.qmd

author:
  - name: Guillaume LAFON
    affiliation: OpenClassrooms
    email: guillaumelafon13@gmail.com
date: last-modified
repo-url: https://github.com/laguill/OC-DataScientist/
repo-actions: [issue]
sharing: [linkedin]

format:
  html:
    theme:
      light: cosmos 
      dark: darkly
    toc: true
    page-layout: full
    lang: fr

    code-tools: true
    code-fold: false
    code-summary: "Show the code"
  # docx: default
  # jats: default

  # (other formats)
  pdf: 
    toc: true
    number-sections: true
    colorlinks: true
    cap-location: bottom
    lang: fr
    bibliography: references.bib
    biblio-title: "References"
    cite-method: biblatex


execute:
  enabled: true
  cache: true
  freeze: auto
  # daemon: 60
  # message: false
  # warning: false
  # echo: true



