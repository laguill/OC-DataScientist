project:
  type: website
  output-dir: _output
  execute-dir: project
  preview:
    port: 7669
    browser: false

editor:
  render-on-save: false

execute:
  enabled: true
  cache: true
  freeze: auto
  daemon: 60
  message: false
  warning: false
  echo: true

lang: fr

author:
  - name: Guillaume LAFON
    affiliation: OpenClassrooms
    email: guillaumelafon13@gmail.com
date: last-modified
repo-url: https://github.com/laguill/OC-DataScientist/
repo-actions: [issue]
sharing: [linkedin]

website:
  title: "Projet 4 - Anticipez les besoins en consommation de bâtiments"
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: true
  open-graph: true

  page-footer:
    border: true
    left: |
      Powered by [{{< iconify simple-icons:quarto title="Quarto Logo" label="Quarto Logo" >}} Quarto](https://quarto.org).
    center: |
      &copy; []{#current-year} Guillaume Lafon. {{< iconify octicon:heart-fill-16 title="Heart" label="Heart" >}}.
    right: |
      License: [CC BY NC SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0).

  sidebar:
    title: false
    style: "docked"
    search: true
    background: "#f8f9fa"
    id: projet4
    contents:
      - section: "Anticipez les besoins en consommation de bâtiments"
        href: index.qmd
        title: "Projet 4"
        contents:
          - href: notebooks/introduction.qmd
          - href: notebooks/exploration.qmd
          - href: notebooks/predictions_emissions.qmd

format:
  html:
    comments:
      hypothesis: false
    code-fold: true
    code-copy: true
    toc: true
    code-summary: "Show the code"

    theme:
      light: flatly
      dark: darkly
    embed-resources: false
    self_contained: false
    page-layout: full
    # output-file: LAFON_Guillaume_web-page_012025.html

#   ipynb:
#      echo: true
#   #   output-file: LAFON_Guillaume_notebook_012025.ipynb

# ipynb-shell-interactivity: all

render:
  - "*.qmd"


