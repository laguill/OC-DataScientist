[project]
authors = [{ name = "laguill", email = "guillaumelafon13@gmail.com" }]
name = "P7_-Implementer_model_scoring"
version = "0.1.0"
description = "Entrainer model de ML pour proposer un crédit à la consommation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "evidently>=0.4.36",
  "imbalanced-learn>=0.13.0",
  "lightgbm>=4.6.0",
  "lime>=0.2.0.1",
  "marimo[recommended]>=0.14.12",
  "mlflow>=3.1.1",
  "mlxtend>=0.23.4",
  "numpy>=2.1.3",
  "optuna>=4.4.0",
  "optuna-integration[mlflow]>=4.4.0",
  "pandas>=2.3.1",
  "plotly>=6.2.0",
  "protobuf>=6.31.1",
  "pyngrok>=7.2.12",
  "scikit-learn-intelex>=2025.7.0",
  "scipy>=1.15.3",
  "seaborn>=0.13.2",
  "shap[plots]>=0.48.0",
  "ty>=0.0.1a15",
  "watchdog>=6.0.0",
  "xgboost>=3.0.2",
  "ydata-profiling[notebook]>=4.16.1",
]

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "ipykernel>=6.30.0",
  "mypy>=1.17.0",
  "uv-bump>=0.2.0",
  "python-lsp-ruff>=2.2.2",
  "python-lsp-server>=1.13.0",
  "pytest>=8.4.1",
]

[tool.marimo.runtime]
pythonpath = ["."]
dotenv = [".env", ".env.path"]

[tool.marimo.experimental]
lsp = true
table_charts = true

[tool.marimo.formatting]
line_length = 120

[tool.marimo.diagnostics]
enabled = true

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb", "*.qmd"]

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN",     # Mypy is better at this
  "COM",     # Formatter takes care of our commas
  "E501",    # leave line-length enforcement to formatter
  "T201",    # I am using print
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",    # D100-104 missing docstring
  "D107",    # undocumented-public-init
  "E402",    # unused import
  "F401",
  "INP001",  # missing __init__ in external library
  "N803",    # variable name should be lower case do not apply in ML
  "N806",    # same as above but for functions
  "PLR1711", # Needed in marimo
  "F821",     # ignore undefined name
  "PLC0415"   # import should be at the top files. Not compatible with notebook
]
# Add the `line-too-long` rule to the enforced rule set.
extend-select = ["W505"]

[tool.ruff.lint.isort]
lines-between-types = 1
lines-after-imports = 2

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.mypy]
# Prototypage
check_untyped_defs = false    # Ne vérifie pas les fonctions non typées
follow_imports = "skip"       # Ignore les modules importés
ignore_missing_imports = true # Ignore les erreurs d'importations
pretty = true                 # Enhance the readability of error messages
show_column_numbers = true
warn_unused_configs = true    # Alerte sur des options non reconnues

[tool.basedpyright]
reportAny = "none"                  # Disable checks for implicit Any
reportExplicitAny = "none"          # Disable checks for explicit Any
reportUnknownVariableType = "none"
reportUnusedImport = "none"
reportUnknownMemberType = "none"
reportUnusedCallResult = "none"
reportMissingTypeStubs = "none"
reportMissingParameterType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
